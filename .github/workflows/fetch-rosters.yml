name: Fetch Guild Rosters

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/data/rosters.json'
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: fetch-guild-rosters
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch guild rosters
        run: node scripts/fetch-rosters.mjs
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/rosters.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update guild rosters")
      
      - name: Push changes
        run: git push
